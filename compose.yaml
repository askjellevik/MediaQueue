services:
  portal:
    image: ghcr.io/askjellevik/mediaqueue:latest   # built for linux/arm64 by GitHub Actions
    restart: unless-stopped
    env_file: .env   # also AUTO_FETCH_PER_MEMBER_DAY (default 3): automatic jobs per opted-in member and UTC day, 0 = none
    environment:
      INTERNAL_LISTEN: "0.0.0.0:8001"   # wildcard bind only where the dedicated network exists
    networks: [workernet]
    ports: ["127.0.0.1:8088:8000"]     # loopback only, never 0.0.0.0
    volumes: ["./data:/data"]           # must be owned by UID 65532
    read_only: true
    tmpfs: ["/tmp:size=8m"]
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    healthcheck:
      test: ["CMD", "/app/mediaqueue", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3

  worker:
    image: ghcr.io/askjellevik/mediaqueue:latest
    command: ["worker"]
    restart: unless-stopped
    # no env_file: compose substitutes INTERNAL_TOKEN from .env, nothing else is handed over
    environment:
      PORTAL_URL: http://portal:8001
      INTERNAL_TOKEN: "${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}"
      RUST_LOG: info
      # The Real-Debrid token is a file, never a value: the assisted and auto modes
      # read it from here, and without the file they stay idle.
      RD_TOKEN_FILE: /run/secrets/rd_token
      WORKER_STATE_DIR: /state
      # The three daily caps apply only to torrents the worker chose itself (auto jobs).
      # A torrent a human picked is not counted against them and not stopped by them.
      WORKER_MAX_ADDS_PER_DAY: "${WORKER_MAX_ADDS_PER_DAY:-5}"
      WORKER_MAX_UNCACHED_PER_DAY: "${WORKER_MAX_UNCACHED_PER_DAY:-2}"
      WORKER_MAX_REFUSALS_PER_DAY: "${WORKER_MAX_REFUSALS_PER_DAY:-20}"
      # Release groups (comma separated, case-insensitive) that earn a bonus in the ranking of
      # Infuse PRO jobs only; free jobs ignore it. Empty switches the bonus off.
      WORKER_PRO_GROUPS: "${WORKER_PRO_GROUPS:-framestor}"
      # The largest torrent, in GB, for Infuse PRO jobs only: the shortlist filter, the auto rule
      # and the worker's own ceiling for a human's pick. Free jobs keep their own limits
      # (40 GB filter, 15 GB auto, WORKER_RD_MAX_GB 30).
      WORKER_PRO_MAX_GB: "${WORKER_PRO_MAX_GB:-100}"
      # What an auto job for an Infuse PRO request counts as already in the Real-Debrid library:
      # a downloaded release of the title and year at least this tall (pixels) and this big (GB).
      # A free request counts a downloaded release that passes the free profile instead.
      WORKER_PRO_HAVE_MIN_HEIGHT: "${WORKER_PRO_HAVE_MIN_HEIGHT:-1080}"
      WORKER_PRO_HAVE_MIN_GB: "${WORKER_PRO_HAVE_MIN_GB:-8}"
      # Names Real-Debrid refuses (error 35), dropped before ranking. The list comes from a
      # third-party post ("Complete List of Real-Debrid's Filename Filters" on DMM), reflects
      # the rules as of 14 October 2026, and may change. Comma separated: "=" in front makes a
      # term case-sensitive, "#" makes it count only after a resolution such as "1080p.", any
      # other term ignores case. Unlike the settings above an empty value is a value (the filter
      # is off), so the default is kept only while the variable is unset (hence "-", not ":-").
      # This default must equal DEFAULT_TERMS in src/worker/rd_terms.rs.
      WORKER_RD_BLOCKED_TERMS: "${WORKER_RD_BLOCKED_TERMS-=WEB-DL,=WEB.x264,=WEB.H264,WEBRip,BDRip,HDRip,DVDRip,HDTV.x264,HDTV.XviD,BluRay.x264,#BluRay.DTS}"
      # Real-Debrid is said to refuse adds with error 35 in bursts, whatever the name. A refusal
      # of a name that matches nothing in the list above is not counted at once: the worker waits
      # this many seconds (0 to 600) and asks again, once. A starting guess; 0 counts it at once.
      WORKER_RD_BURST_WAIT_SECS: "${WORKER_RD_BURST_WAIT_SECS:-180}"
      # The least time, in seconds (0 to 600), between two addMagnet calls of the worker; a run
      # that tries several candidates waits for it. A starting guess; 0 switches it off.
      WORKER_RD_MIN_ADD_GAP_SECS: "${WORKER_RD_MIN_ADD_GAP_SECS:-45}"
    # One-time setup on the host, before the first assisted run (the container user is 65532):
    #   install -d -m 0700 secrets worker-state
    #   chown 65532:65532 secrets/rd_token worker-state && chmod 0400 secrets/rd_token
    # ./secrets/rd_token holds the token alone; ./worker-state keeps counters.json (caps, breaker).
    volumes: ["./secrets/rd_token:/run/secrets/rd_token:ro", "./worker-state:/state"]
    networks: [workernet]
    read_only: true
    tmpfs: ["/tmp:size=4m"]
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 48m
    cpus: 0.25
    pids_limit: 32
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    depends_on:
      portal:
        condition: service_healthy

networks:
  workernet:
    ipam:
      config:
        - subnet: 172.30.0.0/24   # inside the default TRUSTED_PROXY_CIDRS (172.16.0.0/12)
