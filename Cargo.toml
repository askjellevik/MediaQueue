[package]
name = "media-requests"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
    "tower-log",
    "tracing",
    "matched-path",
    "original-uri",
] }
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "net",
    "time",
    "sync",
] }
axum-extra = { version = "0.12", default-features = false, features = [
    "cookie",
] }
tower = { version = "0.5", default-features = false, features = ["limit"] }
tower-http = { version = "0.7", default-features = false, features = [
    "set-header",
    "limit",
    "timeout",
    "catch-panic",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
rust-embed = { version = "8", default-features = false, features = [
    "mime-guess",
    "debug-embed",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
sha2 = "0.11"
hmac = "0.13"
subtle = "2.6"
rand = { version = "0.10", default-features = false, features = [
    "std",
    "std_rng",
    "sys_rng",
    "thread_rng",
] }
argon2 = "0.6"
rpassword = "7"
governor = { version = "0.10", default-features = false, features = [
    "std",
    "dashmap",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
